name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
      - name: Run unit tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unit-test.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            {
              echo "### Unit tests failed"
              echo '```text'
              tail -n 120 unit-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            annotation=$(tail -n 120 unit-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Unit tests failed::$annotation"
            exit "$exit_code"
          fi
        shell: bash -el {0}
      - run: python bench.py
        shell: bash -el {0}
