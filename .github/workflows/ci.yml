name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
      - run: python -m unittest discover -s tests -v
        shell: bash -el {0}
      - run: python bench.py
        shell: bash -el {0}
